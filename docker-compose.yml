services:
  postgres:
    image: postgres:15-alpine
    container_name: vibeflow-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=vibeflow_dev_pass
      - POSTGRES_DB=vibeflow
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend/VibeFlow.API
      dockerfile: Dockerfile
    container_name: vibeflow-backend
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=vibeflow;Username=postgres;Password=vibeflow_dev_pass
    depends_on:
      - postgres
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vibeflow-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  pg-data:

